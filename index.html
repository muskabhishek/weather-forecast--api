<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperlocal Weather & AQI Advisor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-1">Local Air & Weather</h1>
    <p class="text-xs text-center text-slate-400 mb-6">FastAPI + WeatherAPI Key Engine</p>

    <!-- Search Bar -->
    <div class="flex gap-2 mb-5">
      <input type="text" id="localityInput" value="Kalkaji, New Delhi"
        class="flex-1 p-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
        placeholder="Enter locality (e.g. Kalkaji, Delhi)...">
      <button onclick="fetchData()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 rounded-xl transition text-sm">
        Check
      </button>
    </div>

    <!-- Loading Spinner -->
    <p id="loadingText" class="text-center text-slate-500 hidden text-sm py-4 animate-pulse">Fetching live data...</p>

    <!-- Results Card -->
    <div id="resultsContainer" class="hidden">
      <h2 id="resolvedLocation" class="text-center text-xs font-semibold text-slate-500 mb-4 uppercase tracking-wider">
      </h2>

      <!-- Weather & AQI Metrics -->
      <div class="grid grid-cols-2 gap-3 mb-5">
        <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl text-center">
          <p class="text-xs font-semibold text-blue-500 uppercase">Weather</p>
          <p id="tempText" class="text-3xl font-bold text-blue-900 mt-1">--°C</p>
          <p id="conditionText" class="text-xs text-blue-700 mt-1 font-medium">--</p>
        </div>
        <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl text-center">
          <p class="text-xs font-semibold text-slate-500 uppercase">PM 2.5</p>
          <p id="pmText" class="text-3xl font-bold text-slate-800 mt-1">--</p>
          <p id="humidityText" class="text-xs text-slate-600 mt-1 font-medium">Hum: --%</p>
        </div>
      </div>

      <!-- Health Advisory Alert Box -->
      <div id="advisoryBox" class="p-4 rounded-xl border">
        <div class="flex justify-between items-center mb-2">
          <h3 class="font-bold text-base" id="statusText">Status</h3>
          <span id="dangerLevel" class="text-xs font-bold px-2 py-0.5 rounded-full uppercase tracking-wider"></span>
        </div>
        <p class="text-xs font-semibold text-slate-600 mb-2">Recommended Precautions:</p>
        <ul id="precautionsList" class="text-xs space-y-1 list-disc pl-4 text-slate-700 font-medium"></ul>
      </div>
    </div>
  </div>

  <script>
    async function fetchData() {
      const locality = document.getElementById('localityInput').value.trim();
      if (!locality) return;

      const results = document.getElementById('resultsContainer');
      const loading = document.getElementById('loadingText');
      const advisoryBox = document.getElementById('advisoryBox');

      results.classList.add('hidden');
      loading.classList.remove('hidden');

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/forecast?locality=${encodeURIComponent(locality)}`);
        const data = await response.json();

        if (response.ok) {
          document.getElementById('resolvedLocation').innerText = data.resolved_location;
          document.getElementById('tempText').innerText = `${data.weather.temperature_celsius}°C`;
          document.getElementById('conditionText').innerText = data.weather.condition;
          document.getElementById('humidityText').innerText = `Hum: ${data.weather.humidity_percentage}%`;
          document.getElementById('pmText').innerText = data.air_quality.pm2_5;

          const adv = data.health_advisory;
          document.getElementById('statusText').innerText = adv.status;
          document.getElementById('dangerLevel').innerText = adv.danger_level;

          const list = document.getElementById('precautionsList');
          list.innerHTML = '';
          adv.precautions.forEach(p => {
            const li = document.createElement('li');
            li.innerText = p;
            list.appendChild(li);
          });

          // Dynamic Color Coding based on danger level
          advisoryBox.className = 'p-4 rounded-xl border';
          if (adv.danger_level === 'Low') {
            advisoryBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-950');
          } else if (adv.danger_level === 'Moderate') {
            advisoryBox.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-950');
          } else if (adv.danger_level === 'High' || adv.danger_level === 'Very High') {
            advisoryBox.classList.add('bg-orange-50', 'border-orange-200', 'text-orange-950');
          } else {
            advisoryBox.classList.add('bg-red-50', 'border-red-200', 'text-red-950');
          }

          loading.classList.add('hidden');
          results.classList.remove('hidden');
        } else {
          alert(data.detail || "Error fetching data.");
          loading.classList.add('hidden');
        }
      } catch (err) {
        alert("Error connecting to server! Make sure FastAPI is running (uvicorn main:app --reload).");
        loading.classList.add('hidden');
      }
    }
  </script>
</body>

</html>
